<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UFTG - Unicode Text Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Merriweather:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1a73e8;
    --frame:#dce6f0;
    --border:#173a7a;
    --muted:#6b7280;
    --card-bg:#e6eef8;
    --bg:#f5f6f8;
    --text:#111;
    --font-main: 'Inter', Arial, Helvetica, sans-serif;
  }
  [data-theme="dark"]{
    --blue:#5aa0ff;
    --frame:#131419;
    --border:#2b3340;
    --muted:#9aa4b2;
    --card-bg:#101316;
    --bg:#0b0d10;
    --text:#e6eef8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--font-main);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  .container{width:100%;padding:0 18px 80px}
  header{background:var(--bg);padding:18px;}
  header .title{display:flex;flex-direction:column;gap:6px}
  header h1{margin:0;font-size:36px;line-height:1;font-family:Inter, Arial, Helvetica, sans-serif;}
  header p{margin:0;color:var(--muted);font-family:Inter, Arial, Helvetica, sans-serif;}

  .topbar{position:sticky;top:0;z-index:600;margin-top:12px;background:var(--frame);padding:12px;border-radius:6px;display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--border)}
  .topbar input{flex:1;padding:10px 12px;border:2px solid var(--border);border-radius:6px;font-size:16px;background:var(--card-bg);color:var(--text)}
  .btn-paste,.settings-btn{background:var(--blue);color:#fff;border:none;padding:10px 14px;border-radius:6px;cursor:pointer;font-weight:700}
  .theme-toggle{background:transparent;border:2px solid var(--border);color:var(--text);padding:8px;border-radius:6px;cursor:pointer;font-weight:700}

  .section{margin-top:18px}
  .section .heading{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;font-size:18px;padding:6px 0}
  .tri{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--text);transform:rotate(0);transition:transform .15s}
  .tri.closed{transform:rotate(-90deg)}
  .list{margin-top:8px;display:block}
  .list.hidden{display:none}

  .card { border: 2px solid var(--border); border-radius: 10px; background: var(--card-bg); padding: 12px; margin-bottom: 12px; width: 100%; box-sizing: border-box; color:var(--text)}
  .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .card-title{font-weight:700;font-size:20px}
  .card-actions{display:flex;align-items:center;gap:10px}
  .copy-btn{background:var(--blue);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:700}
  .star{cursor:pointer;font-size:20px;color:gray;user-select:none}
  .star.active{color:gold}
  .card-body{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;min-height:44px;white-space:pre-wrap;word-break:break-word;color:var(--text)}
  .card-body .red { color: #ff6b6b; font-weight: 700; }

  .copy-notice, .paste-notice {
    position: fixed;
    bottom: 22px;
    right: 22px;
    background: var(--blue);
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-weight:700;
    opacity:0; transform: translateY(6px);
    transition:opacity .18s, transform .18s;
    z-index:1200;
  }
  .notice.show{opacity:1; transform: translateY(0);}

  .settings-panel {
    position: fixed;
    right: 18px;
    top: 90px;
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    display: none;
    flex-direction: column;
    gap: 12px;
    width: 240px;
    z-index: 900;
    color:var(--text);
  }
  .settings-panel.active{display:flex}
  .settings-panel h3{margin:0;font-size:14px;font-weight:700;color:var(--text)}
  .theme-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
  .theme-btn{color:#fff;font-weight:700;padding:8px 0;border:none;border-radius:6px;cursor:pointer;font-size:14px}
  .font-buttons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .font-btn{flex:1 1 45%;padding:8px 6px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-weight:600;font-size:13px;color:var(--text)}

  .settings-backdrop{position:fixed;inset:0;display:none;z-index:800}
  .settings-backdrop.active{display:block}

  @media (max-width:640px){
    header h1{font-size:28px}
    .topbar{flex-direction:column;align-items:stretch}
    .copy-btn{padding:8px 10px}
    .card{width:calc(100% - 36px)}
    .settings-panel{right:12px;left:12px;width:auto;border-radius:8px}
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>UTG</h1>
    <p>Unicode Text Generator</p>
  </div>
</header>

<div class="topbar" role="group" aria-label="Beviteli sor">
  <input id="mainInput" type="text" placeholder="Írj be akármit..." aria-label="Szöveg beviteli mező">
  <button class="btn-paste" id="pasteBtn" title="Beillesztés">Beillesztés</button>
  <button class="settings-btn" id="settingsBtn" aria-expanded="false" aria-controls="settingsPanel">Beállítások</button>
</div>

<div id="copyNotice" class="copy-notice notice">✓ Másolva</div>
<div id="pasteNotice" class="paste-notice notice">✓ Beillesztve</div>

<div class="settings-backdrop" id="settingsBackdrop" aria-hidden="true"></div>
<div class="settings-panel" id="settingsPanel" role="region" aria-label="Beállítások">
  <div>
    <h3>Témaválasztó</h3>
    <div class="theme-buttons" role="menu">
      <button class="theme-btn" data-color="blue" style="background:#1a73e8">Kék</button>
      <button class="theme-btn" data-color="yellow" style="background:#fbbc05;color:#000">Sárga</button>
      <button class="theme-btn" data-color="red" style="background:#ea4335">Piros</button>
      <button class="theme-btn" data-color="purple" style="background:#a142f4">Lila</button>
      <button class="theme-btn" data-color="green" style="background:#34a853">Zöld</button>
      <button class="theme-btn" data-color="pink" style="background:#ff5fa2">Rózsaszín</button>
      <button class="theme-btn" data-color="dark" style="background:#222">Sötét</button>
      <button class="theme-btn" data-color="light" style="background:#fff;color:#000">Világos</button>
    </div>
  </div>

  <div>
    <h3>Betűtípus</h3>
    <div class="font-buttons" role="menu">
      <button class="font-btn" data-font="Inter" style="font-family:Inter">Inter</button>
      <button class="font-btn" data-font="Merriweather" style="font-family:Merriweather">Merriweather</button>
      <button class="font-btn" data-font="Roboto" style="font-family:Roboto">Roboto</button>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
    <small style="color:var(--muted)">Mentett beállítások</small>
    <button id="resetSettings" class="theme-btn" style="background:#aaa;color:#000;padding:6px 10px">Reset</button>
  </div>
</div>

<main class="container">
  <section class="section" id="section-recent">
    <div class="heading" data-target="recentList" role="button" tabindex="0">
      <div class="tri closed" id="tri-recent"></div>
      <div>Legutóbbiak</div>
    </div>
    <div id="recentList" class="list hidden"></div>
  </section>

  <section class="section" id="section-favs">
    <div class="heading" data-target="favList" role="button" tabindex="0">
      <div class="tri closed" id="tri-fav"></div>
      <div>Kedvencek</div>
    </div>
    <div id="favList" class="list hidden"></div>
  </section>

  <section class="section" id="section-fonts">
    <div class="heading" data-target="fontsList" role="button" tabindex="0">
      <div class="tri" id="tri-fonts"></div>
      <div>Betűtípusok</div>
    </div>
    <div id="fontsList" class="list"></div>
  </section>
</main>

/* ------------------ UNICODE KÁRTYÁK ------------------ */
const SPECIAL_STYLES = [
  { id:'Unicode code', name:'Unicode code', encode:true },
  { id:'Decode Unicode', name:'Decode Unicode', decode:true }
];

/* ===== helpers & state ===== */
const ls = window.localStorage;
let FAVORITES = new Set(JSON.parse(ls.getItem('uftg_favs')||'[]'));
let RECENT = JSON.parse(ls.getItem('uftg_recent')||'[]');

/* normalize: vissza latinra (auto “Plain”) */
const NORMALIZE_MAP = {};
STYLE_DEFS.forEach(style=>{
  for(const [latin,fancy] of Object.entries(style.map)){
    if(!NORMALIZE_MAP[fancy]) NORMALIZE_MAP[fancy]=latin;
  }
});
function normalizeChar(ch){ return NORMALIZE_MAP[ch]||ch; }

/* ===== encoding / decoding ===== */
function encodeUnicode(text){
  return Array.from(text).map(c=>{
    const cp=c.codePointAt(0).toString(16).toUpperCase().padStart(4,'0');
    return `U+${cp}`;
  }).join('');
}

function decodeUnicode(text){
  return text.replace(/U\+([0-9A-Fa-f]{4,6})/g,(m,h)=>{
    const code=parseInt(h,16);
    try{return String.fromCodePoint(code);}catch{ return m;}
  });
}

/* ===== escaping / transforming ===== */
function escapeHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function transformTextHtml(text,map,options={}){
  if(!text) return '';
  if(options.encode) return escapeHtml(encodeUnicode(text));
  if(options.decode) return escapeHtml(decodeUnicode(text));

  return Array.from(text).map(ch=>{
    const base = normalizeChar(ch);
    return map[base] ? escapeHtml(map[base]) : `<span class="red">${escapeHtml(base)}</span>`;
  }).join('');
}

function transformTextPlain(text,map,options={}){
  if(!text) return '';
  if(options.encode) return encodeUnicode(text);
  if(options.decode) return decodeUnicode(text);

  return Array.from(text).map(ch=>{
    const base = normalizeChar(ch);
    return map[base] || base;
  }).join('');
}

/* ===== UI — kártyák ===== */
function createStyleCard(def){
  const input = document.getElementById('mainInput').value || '';
  const transformedHtml = transformTextHtml(input, def.map||{}, def);
  const transformedPlain = transformTextPlain(input, def.map||{}, def);

  const card=document.createElement('div'); card.className='card'; card.dataset.styleId=def.id;

  const header=document.createElement('div'); header.className='card-header';
  const title=document.createElement('div'); title.className='card-title'; title.textContent=def.name;
  const actions=document.createElement('div'); actions.className='card-actions';

  const copyBtn=document.createElement('button'); copyBtn.className='copy-btn'; copyBtn.textContent='Másolás';
  copyBtn.addEventListener('click', async ()=>{
    await safeCopy(transformedPlain);
    showCopyNotice();
    addRecent(def.id);
    renderAllSections();
    const sel=`.card[data-style-id="${def.id}"] .copy-btn`;
    const newBtn=document.querySelector(sel);
    if(!newBtn) return;
    const old=newBtn.textContent;
    newBtn.textContent='✓ Másolva'; newBtn.disabled=true;
    setTimeout(()=>{ newBtn.textContent=old; newBtn.disabled=false; },3000);
  });

  const star=document.createElement('span'); star.className='star'+(FAVORITES.has(def.id)?' active':'');
  star.innerText=FAVORITES.has(def.id)?'★':'☆';
  star.addEventListener('click', ()=> toggleFavorite(def.id));

  actions.appendChild(copyBtn); actions.appendChild(star);
  header.appendChild(title); header.appendChild(actions);

  const body=document.createElement('div'); body.className='card-body'; body.innerHTML=transformedHtml;

  card.appendChild(header); card.appendChild(body);
  return card;
}

/* renderelők */
function renderFonts(){
  const c=document.getElementById('fontsList'); c.innerHTML='';
  [...STYLE_DEFS, ...SPECIAL_STYLES].forEach(def=>c.appendChild(createStyleCard(def)));
}
function renderRecent(){
  const c=document.getElementById('recentList'); c.innerHTML='';
  if(!RECENT.length){ c.innerHTML=`<div style="color:var(--muted);padding:8px">Nincs még legutóbbi stílus.</div>`; return;}
  RECENT.forEach(id=>{
    const d=[...STYLE_DEFS,...SPECIAL_STYLES].find(s=>s.id===id);
    if(d) c.appendChild(createStyleCard(d));
  });
}
function renderFavorites(){
  const c=document.getElementById('favList'); c.innerHTML='';
  const favs=[...STYLE_DEFS,...SPECIAL_STYLES].filter(s=>FAVORITES.has(s.id));
  if(!favs.length){ c.innerHTML=`<div style="color:var(--muted);padding:8px">Nincs kedvenc.</div>`; return;}
  favs.forEach(d=>c.appendChild(createStyleCard(d)));
}

function renderAllSections(){ renderFonts(); renderRecent(); renderFavorites(); syncStars(); }
function syncStars(){
  document.querySelectorAll('.card').forEach(c=>{
    const id=c.dataset.styleId; if(!id) return;
    const s=c.querySelector('.star'); if(!s) return;
    if(FAVORITES.has(id)){s.classList.add('active');s.innerText='★';}
    else{s.classList.remove('active');s.innerText='☆';}
  });
}

/* state helpers */
function addRecent(id){
  if(!id) return;
  RECENT=[id,...RECENT.filter(x=>x!==id)].slice(0,5);
  ls.setItem('uftg_recent',JSON.stringify(RECENT));
  renderRecent();
}
function toggleFavorite(id){
  if(FAVORITES.has(id)) FAVORITES.delete(id); else FAVORITES.add(id);
  ls.setItem('uftg_favs',JSON.stringify([...FAVORITES]));
  renderAllSections();
}

/* clipboard */
async function safeCopy(t){
  if(!t) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ await navigator.clipboard.writeText(t); return; }catch(e){}
  }
  const ta=document.createElement('textarea');
  ta.value=t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
function showCopyNotice(){ const n=document.getElementById('copyNotice'); if(!n) return; n.classList.add('show'); setTimeout(()=>n.classList.remove('show'),1700); }
function showPasteNotice(){ const n=document.getElementById('pasteNotice'); if(!n) return; n.classList.add('show'); setTimeout(()=>n.classList.remove('show'),1700); }

/* sections toggle + paste */
function toggleSectionById(listId,triId){
  const l=document.getElementById(listId),t=document.getElementById(triId);
  if(!l||!t) return;
  if(l.classList.contains('hidden')){ l.classList.remove('hidden'); t.classList.remove('closed'); }
  else{ l.classList.add('hidden'); t.classList.add('closed'); }
}
async function doPaste(){
  try{
    if(navigator.clipboard && navigator.clipboard.readText){
      const t=await navigator.clipboard.readText();
      document.getElementById('mainInput').value=t;
      ls.setItem('uftg_last_input',t);
      renderAllSections();
      showPasteNotice();
    }
  }catch(e){}
}

/* theme/font */
function applySavedTheme(){
  const theme=ls.getItem('uftg_theme');
  if(!theme) return;
  if(theme==='dark'){ document.documentElement.setAttribute('data-theme','dark'); }
  else if(theme==='light'){ document.documentElement.removeAttribute('data-theme'); }
  else{ document.documentElement.removeAttribute('data-theme'); }
}
function applySavedFont(){
  const f=ls.getItem('uftg_font'); if(!f) return;
  document.documentElement.style.setProperty('--font-main', `'${f}', Arial, Helvetica, sans-serif`);
  document.body.style.fontFamily='var(--font-main)';
}

/* reset */
function resetSettingsToDefault(){
  ls.removeItem('uftg_theme'); ls.removeItem('uftg_font');
  document.documentElement.removeAttribute('data-theme');
  document.documentElement.style.removeProperty('--font-main');
  document.body.style.fontFamily='';
}

/* init */
document.addEventListener('DOMContentLoaded',()=>{
  const sBtn=document.getElementById('settingsBtn');
  const sPanel=document.getElementById('settingsPanel');
  const backdrop=document.getElementById('settingsBackdrop');
  const pasteBtn=document.getElementById('pasteBtn');
  const input=document.getElementById('mainInput');

  input.value=ls.getItem('uftg_last_input')||'';
  input.addEventListener('input',()=>{
    ls.setItem('uftg_last_input',input.value);
    document.querySelectorAll('.card-body').forEach(b=>{
      const id=b.closest('.card').dataset.styleId;
      const def=[...STYLE_DEFS,...SPECIAL_STYLES].find(s=>s.id===id)||{};
      b.innerHTML=transformTextHtml(input.value||'',def.map||{},def);
    });
  });

  sBtn.addEventListener('click',(e)=>{
    e.stopPropagation();
    const open=sPanel.classList.toggle('active');
    backdrop.classList.toggle('active',open);
    sBtn.setAttribute('aria-expanded',open?'true':'false');
  });
  document.addEventListener('click',(e)=>{
    if(!sPanel.contains(e.target) && e.target!==sBtn){
      sPanel.classList.remove('active'); backdrop.classList.remove('active');
      sBtn.setAttribute('aria-expanded','false');
    }
  });

  document.querySelectorAll('.theme-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const color=btn.dataset.color;
      if(color==='dark'){ document.documentElement.setAttribute('data-theme','dark'); }
      else if(color==='light'){ document.documentElement.removeAttribute('data-theme'); }
      ls.setItem('uftg_theme',color);
      sPanel.classList.remove('active'); backdrop.classList.remove('active');
      sBtn.setAttribute('aria-expanded','false');
    });
  });

  document.querySelectorAll('.font-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const f=btn.dataset.font;
      document.documentElement.style.setProperty('--font-main', `'${f}', Arial, Helvetica, sans-serif`);
      document.body.style.fontFamily='var(--font-main)';
      ls.setItem('uftg_font',f);
      sPanel.classList.remove('active'); backdrop.classList.remove('active');
      sBtn.setAttribute('aria-expanded','false');
    });
  });

  document.getElementById('resetSettings').addEventListener('click',()=>{
    resetSettingsToDefault();
    alert('Beállítások visszaállítva alapértelmezettre.');
  });

  pasteBtn.addEventListener('click',doPaste);
  document.addEventListener('copy',()=>showCopyNotice());

  document.querySelector('[data-target="fontsList"]').addEventListener('click',()=>toggleSectionById('fontsList','tri-fonts'));
  document.querySelector('[data-target="recentList"]').addEventListener('click',()=>toggleSectionById('recentList','tri-recent'));
  document.querySelector('[data-target="favList"]').addEventListener('click',()=>toggleSectionById('favList','tri-fav'));

  applySavedTheme();
  applySavedFont();

  document.getElementById('tri-fonts').classList.remove('closed');
  document.getElementById('tri-recent').classList.add('closed');
  document.getElementById('tri-fav').classList.add('closed');

  renderAllSections();
});
</script>
</body>
